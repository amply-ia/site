<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amply — tecnologia e marketing digital pra sua empresa: bot de WhatsApp com IA + CRM, sites profissionais, tráfego pago (Meta Ads e Google Ads) e SEO."
    />
    <title>Amply — Bot com IA, Sites, Tráfego Pago e SEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Dados cadastrais no HTML estático: o site é uma SPA (o #root sai vazio do
      servidor), e crawlers que não executam JS — como o facebookexternalhit da
      Meta — não enxergariam a razão social renderizada pelo React.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Amply",
        "legalName": "JOAO VITOR MEDEIROS DOS SANTOS",
        "taxID": "59.736.692/0001-83",
        "url": "https://www.amplyia.com.br",
        "email": "joao@amplyia.com.br",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Benedito Lopes Vieira, 144",
          "addressLocality": "Itapetininga",
          "addressRegion": "SP",
          "postalCode": "18209-360",
          "addressCountry": "BR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Dados cadastrais em HTML estático, FORA do #root (o React nunca sobrescreve).
      Precisa ser texto visível de verdade no documento servido: o verificador da
      Meta procura a razão social no site e não executa JavaScript, então nada
      renderizado pelo React — nem JSON-LD, nem <noscript> — serve para ele.
    -->
    <address
      class="border-t border-border px-4 pb-32 pt-8 text-center text-xs not-italic leading-relaxed text-muted-foreground sm:pb-8"
    >
      JOAO VITOR MEDEIROS DOS SANTOS — CNPJ 59.736.692/0001-83<br />
      Rua Benedito Lopes Vieira, 144 — Vila Regina, Itapetininga/SP — CEP 18209-360<br />
      contato:
      <a class="underline underline-offset-2" href="mailto:joao@amplyia.com.br"
        >joao@amplyia.com.br</a
      >
    </address>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
